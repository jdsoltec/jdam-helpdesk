<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JDAM HelpDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F5F8F8;--sf:#fff;--tx:#162527;--mu:#64797C;--ln:#E4ECED;--ac:#046A73;--ac2:#00C2D8;--on:#fff;--red:#C03A2B;--amb:#9A6200;--grn:#1B7F52;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0A1415;--sf:#111F21;--tx:#E6F0F0;--mu:#8AA1A4;--ln:#1E3134;--ac:#3DD2DD;--ac2:#00D4EA;--on:#04201F;--red:#FF9088;--amb:#F0B94F;--grn:#62D69C}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0A1415;--sf:#111F21;--tx:#E6F0F0;--mu:#8AA1A4;--ln:#1E3134;--ac:#3DD2DD;--ac2:#00D4EA;--on:#04201F;--red:#FF9088;--amb:#F0B94F;--grn:#62D69C}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.55 Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(760px 380px at 88% -140px,color-mix(in srgb,var(--ac2) 16%,transparent),transparent) no-repeat,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
small,.mu{color:var(--mu)}small{font-size:12.5px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 24px}
.brand img{height:40px;width:40px}
.brand span{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ac)}
.brand small{font-size:12.5px;font-weight:600;letter-spacing:.14em}
.nb{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:600}
.nb svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nb:hover{color:var(--tx)}
.nb[aria-current=page]{background:var(--sf);color:var(--ac);box-shadow:0 0 0 1px var(--ln)}
.foot{margin-top:auto;padding:12px 12px 0;font-size:13.5px}
main{padding:34px clamp(18px,4.5vw,56px) 56px;max-width:1080px;width:100%}
h1{font-size:30px;font-weight:800;margin:0 0 4px;letter-spacing:-.025em;line-height:1.15}
h2{font-size:15px;font-weight:700;margin:32px 0 10px;color:var(--mu)}
h3{font-size:14.5px;font-weight:700;margin:22px 0 8px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.badge{font-size:12.5px;font-weight:600;padding:4px 12px;border-radius:99px;background:color-mix(in srgb,var(--ac) 9%,transparent);color:var(--ac)}
.lead{font-size:23px;line-height:1.4;font-weight:600;letter-spacing:-.015em;max-width:620px;margin:0}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 16px}
.chip{border:0;background:none;color:var(--mu);border-radius:99px;padding:7px 15px;font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--sf);color:var(--ac);box-shadow:0 0 0 1px var(--ln)}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:grid;grid-template-columns:8px minmax(0,1fr) auto minmax(92px,auto);align-items:center;gap:16px;width:100%;text-align:left;background:var(--sf);border:0;border-radius:14px;padding:15px 20px;box-shadow:0 0 0 1px var(--ln)}
button.it:hover,.card:hover{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ac) 45%,var(--ln))}
.bar{width:8px;height:8px;border-radius:50%;background:var(--c,color-mix(in srgb,var(--mu) 45%,transparent))}
.m b{display:block;font-weight:700}.m small{display:block}
.tg{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--c,var(--mu)) 12%,transparent);color:var(--c,var(--mu))}
.r{--c:var(--red)}.a{--c:var(--amb)}.g{--c:var(--grn)}
.ex{text-align:right}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.col{display:flex;flex-direction:column;gap:8px;min-height:150px;align-content:start}
.col h3{margin:0 0 4px;display:flex;justify-content:space-between;color:var(--mu)}
.card{background:var(--sf);border:0;border-radius:14px;padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 0 0 1px var(--ln)}
#sc{position:fixed;inset:0;background:#08141666;backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--sf);border-radius:22px 0 0 22px;transform:translateX(105%);transition:transform .24s;overflow:auto;padding:calc(22px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));z-index:30}
body.op #sc{opacity:1;pointer-events:auto}body.op #dr{transform:none;box-shadow:-20px 0 60px #0003}
@media(prefers-reduced-motion:reduce){#sc,#dr,.toast{transition:none}}
#dr h2{margin:0;font-size:22px;color:var(--tx);letter-spacing:-.02em;line-height:1.25}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:16px 0}.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600}
.btn{border:0;background:var(--ac);color:var(--on);border-radius:11px;padding:10px 17px;font-weight:700}
.btn.o{background:none;color:var(--ac);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ac) 50%,transparent)}
.msg{border-left:2px solid var(--ln);padding:2px 14px;margin:14px 0}.msg.me{border-color:var(--ac)}
.msg.note{border-color:var(--amb);background:color-mix(in srgb,var(--amb) 8%,transparent);border-radius:0 10px 10px 0}.msg p{margin:2px 0}
textarea{width:100%;min-height:74px;background:var(--bg);color:var(--tx);border:0;box-shadow:0 0 0 1px var(--ln);border-radius:12px;padding:10px 12px;font:inherit;margin-bottom:12px}
.steps{list-style:none;padding:0;margin:8px 0 16px;display:grid;gap:7px}
.steps li{display:flex;gap:11px;align-items:center;color:var(--mu)}
.steps li::before{content:'';width:10px;height:10px;border-radius:50%;border:2px solid var(--ln)}
.steps li.d{color:var(--tx)}.steps li.d::before{background:var(--ac);border-color:var(--ac)}.steps li.c{font-weight:700;color:var(--ac)}
.tl{list-style:none;margin:14px 0;padding:0 0 0 14px;border-left:2px solid var(--ln)}
.tl li{position:relative;padding:0 0 18px 14px}
.tl li::before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.tl small{display:block}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph div{aspect-ratio:4/3;border:1.5px dashed var(--ln);border-radius:12px;display:grid;place-items:center;color:var(--mu);font-size:12.5px}
.qr{width:104px;flex:none;text-align:center}.qr svg{width:100%;background:#fff;border-radius:10px;padding:5px;fill:#10292c}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:40;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:760px){
.app{grid-template-columns:1fr}
.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;background:var(--sf);box-shadow:0 -1px 0 var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:0}
.brand,.foot{display:none}
.nb{flex-direction:column;justify-content:center;gap:3px;font-size:10.5px;padding:8px 0;text-align:center}
.nb[aria-current=page]{background:none;box-shadow:none}
main{padding-bottom:104px}
.it{grid-template-columns:8px minmax(0,1fr) auto}.ex{display:none}
#dr{border-radius:0}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
</style></head><body>

const ch=(k,l)=>`<div class="chips">${l.map(x=>`<button class="chip" data-f="${k}" data-val="${x}" aria-pressed="${F[k]==x}">${x}</button>`).join('')}</div>`;
const B={
hoy:()=>{const u=TK.filter(x=>x.s!='Resuelto'&&x.h<=4),v=VC.filter(x=>x.dd<=30),l=OT.filter(x=>x.s==4);
return `<p class="lead">${TK.filter(x=>x.s!='Resuelto').length} tickets abiertos, ${EQ.filter(x=>x.s=='En taller').length} equipos en el taller y ${v.length} vencimientos en los próximos 30 días.</p><h2>Tickets por incumplir el SLA</h2>${L(u.map(tr))}<h2>Listos para entregar</h2>${L(l.map(or))}<h2>Vencen en 30 días</h2>${L(v.map(vc))}`},
t:()=>ch('t',['Todos','Nuevo','En curso','Esperando cliente','Resuelto'])+L(TK.filter(x=>F.t=='Todos'||x.s==F.t).map(tr)),
o:()=>`<div class="board">${ES.map((s,i)=>{const a=OT.filter(o=>o.s==i);return `<div class="col"><h3>${s} <small>${a.length}</small></h3>${a.map(o=>`<button class="card" data-k="o" data-id="${o.id}"><b>${o.q}</b><small>${o.c}</small><small>${o.f}</small></button>`).join('')||'<small>Sin órdenes</small>'}</div>`}).join('')}</div>`,
e:()=>ch('e',['Todos','En servicio','En taller'])+L(EQ.filter(x=>F.e=='Todos'||x.s==F.e).map(er)),
v:()=>ch('v',['Vencimientos','Credenciales'])+(F.v=='Vencimientos'?`<p class="mu">Se envía un aviso por correo 60, 30 y 7 días antes de cada fecha.</p>${L(VC.map(vc))}`:`<p class="mu">Las contraseñas viven en Bitwarden. Aquí solo se guarda la referencia al ítem.</p>${L(CR.map(cr))}`)};
const kv=a=>`<dl class="kv">${a.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
function qr(sd){let s=[...sd].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),r='';const n=21,f=(x,y)=>{const a=x<7&&y<7,b=x>13&&y<7,c=x<7&&y>13;if(!(a||b||c))return null;const u=b?x-14:x,v=c?y-14:y;return u==0||u==6||v==0||v==6||(u>1&&u<5&&v>1&&v<5)};
for(let y=0;y<n;y++)for(let x=0;x<n;x++){s=(Math.imul(s,1103515245)+12345)>>>0;let o=f(x,y);if(o===null)o=(s>>>16)&1;if(o)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
return `<svg viewBox="-1 -1 23 23" aria-hidden="true">${r}</svg>`}
const D={
t:x=>`<h2 style="margin-top:0">${x.t}</h2><small>${x.id}</small>${kv([['Cliente',x.c],['Prioridad',x.p],['Estado',x.s],['Asignado a',x.w],['Respuesta',x.s=='Resuelto'?'Cumplida':sla(x.h)]])}<div class="msg"><b>${x.c}</b><p>${x.d}</p></div><div class="msg me"><b>JDAM Soporte</b><p>Recibimos su ticket y lo estamos revisando.</p></div><div class="msg note"><b>Nota interna</b> <small>El cliente no la ve</small><p>Verificar que el cliente tenga horas disponibles en su plan.</p></div><textarea placeholder="Escribir una respuesta o una nota"></textarea><button class="btn" data-t="Respuesta enviada al cliente (simulado)">Responder al cliente</button> <button class="btn o" data-t="Nota interna guardada (simulado)">Guardar nota interna</button>`,
o:x=>`<h2 style="margin-top:0">${x.q}</h2><small>${x.id}</small>${kv([['Cliente',x.c],['Falla reportada',x.f],['Ingreso',x.d]])}<h3>Estado</h3><ol class="steps">${ES.map((s,i)=>`<li class="${i<x.s?'d':i==x.s?'d c':''}">${s}</li>`).join('')}</ol>${x.s<5?`<button class="btn" data-adv="${x.id}">Pasar a ${ES[x.s+1].toLowerCase()}</button>`:''}<h3>Revisión al recibir</h3><p>Accesorios recibidos: cable de poder. Daños visibles: ninguno. Contraseña del equipo anotada.</p><div class="ph"><div>Foto 1</div><div>Foto 2</div><div>Foto 3</div></div><h3>Cotización</h3><p>${x.s<2?'Pendiente de diagnóstico.':x.s==2?'Enviada, esperando la aprobación del cliente.':'Aprobada por el cliente.'}</p><button class="btn o" data-t="Enlace copiado (simulado)">Copiar enlace de aprobación</button>`,
e:x=>`<h2 style="margin-top:0">${x.n}</h2><small>${x.id}</small><div style="display:flex;gap:16px;align-items:flex-start">${kv([['Cliente',x.c],['Ubicación',x.u],['Tipo',x.ty],['Serie',x.sr],['Estado',x.s]])}<div class="qr">${qr(x.id)}<small>Etiqueta QR, ilustrativa</small></div></div><h3>Historial del equipo</h3><ol class="tl">${x.h.map(([d,t])=>`<li><small>${d}</small>${t}</li>`).join('')}</ol>`};
function R(){const[t,s]=H[V];$('#m').innerHTML=`<div class="top"><div><h1>${t}</h1><p class="mu" style="margin:0">${s}</p></div><span class="badge">Prototipo con datos de ejemplo</span></div>`+B[V]();document.querySelectorAll('.nb').forEach(b=>b.setAttribute('aria-current',b.dataset.v==V?'page':'false'))}
function op(k,x){$('#dr').innerHTML=`<button class="btn o" data-x style="float:right">Cerrar</button>`+D[k](x);document.body.classList.add('op');$('#dr').scrollTop=0}
const cl=()=>document.body.classList.remove('op');
let tm;function tt(m){const e=$('#to');e.textContent=m;e.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>e.classList.remove('on'),2200)}
document.addEventListener('click',e=>{const a=e.target.closest('button,[data-x]');if(!a)return;const d=a.dataset;
if(d.v){V=d.v;cl();R()}
else if(d.f){F[d.f]=d.val;R()}
else if(d.k){op(d.k,{t:TK,o:OT,e:EQ}[d.k].find(x=>x.id==d.id))}
else if(d.adv){const x=OT.find(o=>o.id==d.adv);x.s++;op('o',x);R()}
else if(d.t)tt(d.t);
else if(d.x!==undefined)cl()});
document.addEventListener('keydown',e=>{if(e.key=='Escape')cl()});
R();
</script></body></html>
